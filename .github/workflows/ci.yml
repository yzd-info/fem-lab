# FEM Lab sürekli entegrasyon: depodaki üç test grubunu yerelde çalıştırılan komutların aynısıyla koşar.
#   python3 tests.py                                 (kâğıt testleri; LaTeX derlemesi ve verification --quick/--compare dahil)
#   node tests.js                                    (tarayıcı çekirdeği testleri; npm bağımlılığı yok, yalnız Node)
#   node tests_basis.js                              (Basis functions kartı ve basis_core.js)
#   node tests_sim.js                                (FEM Simulation paneli ve fem_sim.js)
#   python3 verification/run_verification.py --full (bağımsız doğrulama, n = 4…32)
#   python3 verification/run_corpus.py               (80 vakalık girdi korpusu + scikit-fem bağımsız referansı)
# Herhangi biri sıfırdan farklı çıkış kodu verirse iş başarısız olur.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 3.9: geliştirme makinesindeki sürüm (sözdizimi uyumu); 3.12: güncel sürüm
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python bağımlılıkları (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sympy, mpmath; print('sympy', sympy.__version__, '· mpmath', mpmath.__version__)"

      # scikit-fem tests.py'den ÖNCE kurulur: tests.py sürekli düzey doğrulamasını (verification/continuous_problem.py)
      # çalıştırır; o modül ayrıştırıcıyı skfem_reference'tan alır (üçüncü bir ayrıştırıcı yazılmasın diye).
      - name: Doğrulama bağımlılıkları (scikit-fem)
        run: python -m pip install -r verification/requirements-verify.txt

      # tests.py, pdflatex yoksa LaTeX derleme kontrollerini SESSİZCE atlar; CI'da atlanmasın diye kurulur ve
      # kâğıdın kullandığı paketlerin varlığı ayrıca denetlenir.
      - name: LaTeX (pdflatex ve kâğıdın paketleri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern
          pdflatex --version | head -1
          for f in inputenc.sty fontenc.sty lmodern.sty amsmath.sty amssymb.sty graphicx.sty geometry.sty; do
            kpsewhich "$f" || { echo "eksik LaTeX paketi: $f"; exit 1; }
          done

      - name: Python testleri (tests.py)
        run: python tests.py

      - name: JavaScript testleri (tests.js)
        run: node tests.js
      - name: Basis functions testleri (tests_basis.js)
        run: node tests_basis.js
      - name: FEM Simulation testleri (tests_sim.js)
        run: node tests_sim.js

      - name: Bağımsız doğrulama (--full)
        run: python verification/run_verification.py --full

      # 80 vakalık yalnız-girdi korpusu: gerçek sunucu hattı + tarayıcı çekirdeği + scikit-fem bağımsız referansı.
      # Bir vaka FAIL ise iş başarısız olur; rapor her durumda yüklenir (başarısızlık sessizce kaybolmasın).
      - name: Girdi korpusu ve scikit-fem doğrulaması
        run: python verification/run_corpus.py

      - name: Korpus raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-results-py${{ matrix.python }}
          path: verification/corpus_results/
